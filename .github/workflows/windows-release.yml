name: R4 Windows Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r4-windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  MPLBACKEND: Agg
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  package:
    name: Build verified Windows package
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock-py313-win64-r4.txt

      - name: Install locked R4 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock-py313-win64-r4.txt

      - name: Build and verify release candidate
        shell: powershell
        run: |
          $python = (Get-Command python).Source
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_release_r4.ps1 -PythonPath $python

      - name: Upload release candidate and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PourbaixStudioR4-${{ github.sha }}
          path: |
            _release/R4.0/PourbaixStudioR4-win64.zip
            _release/R4.0/release-manifest.json
          if-no-files-found: error
          retention-days: 14
